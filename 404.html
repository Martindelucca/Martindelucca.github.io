<!DOCTYPE html>
<html lang="es-AR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esta página no existe — Martin de Lucca</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#16150F" />
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Página de error: la identidad completa, ninguna sección de venta. */
    .err { display: flex; flex-direction: column; min-height: 100vh; padding: clamp(24px, 4vw, 40px) var(--pad-x); }
    .err__head { display: flex; align-items: center; gap: 9px; }
    .err__body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: clamp(48px, 9vw, 96px) 0; max-width: 22em; }
    .err__code { font-size: 11px; font-weight: 640; letter-spacing: .12em; color: var(--faint); margin-bottom: clamp(20px, 3vw, 28px); }
    .err__t { font-size: clamp(38px, 7vw, 78px); line-height: .96; letter-spacing: -.04em; font-weight: var(--w-display); text-wrap: balance; }
    .err__d { margin-top: clamp(20px, 2.6vw, 28px); font-size: clamp(16px, 1.2vw, 18px); line-height: 1.6; color: var(--muted); text-wrap: pretty; }
    .err__actions { display: flex; flex-wrap: wrap; align-items: center; gap: clamp(14px, 2vw, 22px); margin-top: clamp(30px, 3.6vw, 40px); }
    .err__foot { font-size: 11.5px; font-weight: 500; letter-spacing: .01em; color: var(--faint); }
  </style>
</head>

<body>

  <div class="err bg-grid">
    <header class="err__head">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Martin de Lucca</span>
      </a>
    </header>

    <main class="err__body">
      <p class="err__code">ERROR 404</p>
      <h1 class="err__t">Esta página no existe.</h1>
      <p class="err__d">Puede que el link esté mal escrito o que la página haya cambiado de lugar. Desde el inicio
        llegás a todo lo demás.</p>
      <div class="err__actions">
        <a class="btn btn--dark" href="/">
          Volver al inicio
          <span class="btn__arrow btn__arrow--lg" aria-hidden="true">→</span>
        </a>
        <a class="link-under"
          href="https://wa.me/543524401654?text=Hola%20Martin%2C%20quiero%20contarte%20sobre%20mi%20negocio%20y%20ver%20qu%C3%A9%20tipo%20de%20web%20me%20podr%C3%ADa%20servir.">Escribime
          por WhatsApp</a>
      </div>
    </main>

    <p class="err__foot">Córdoba, Argentina</p>
  </div>

</body>

</html>
